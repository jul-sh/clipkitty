name: Generate Xcode workspace
description: Generate the workspace, retrying transient dependency downloads.

runs:
  using: composite
  steps:
    - name: Generate workspace
      shell: bash
      run: |
        set -euo pipefail
        workspace_log=$(mktemp "${RUNNER_TEMP:-/tmp}/clipkitty-workspace.XXXXXX")
        trap 'rm -f "$workspace_log"' EXIT
        for attempt in 1 2 3; do
          if make workspace 2>&1 | tee "$workspace_log"; then
            exit 0
          else
            workspace_status=$?
          fi
          # SwiftPM fetches binary artifacts while Nix materializes the
          # workspace. A failed download is not cached; retry just that work.
          if [ "$attempt" -eq 3 ] || ! grep -Eiq \
            'downloadError\("The request timed out|HTTP error (429|5[0-9]{2})|Could not resolve host|Connection timed out|Connection reset by peer|The network connection was lost|Failed to connect to' \
            "$workspace_log"; then
            exit "$workspace_status"
          fi
          echo "::warning::Workspace dependency download failed (attempt $attempt of 3); retrying in 30 seconds."
          sleep 30
        done
