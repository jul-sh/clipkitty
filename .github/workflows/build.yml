name: Build and Release
run-name: Duo screenshot diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  NIX_CONFIG: |
    access-tokens = github.com=${{ github.token }}
jobs:
  ios-screenshots:
    name: iOS Screenshots (${{ matrix.device }})
    if: github.event_name != 'pull_request'
    # The app requires the iOS 27.1+ SDK, and Duo needs its simulator runtime.
    runs-on: xcode-27
    strategy:
      fail-fast: false
      matrix:
        include:
          - device: iphone-duo
            target: screenshots-ios-duo
            outdir: marketing-ios-duo

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          lfs: true

      - name: Select iOS Xcode
        uses: ./.github/actions/setup-xcode

      - name: Set up Nix
        uses: ./.github/actions/setup-nix

      - name: Install CI tools from Nix
        run: |
          nix profile install --no-update-lock-file .#tuist
          tuist version

      - name: Setup Swift
        uses: swift-actions/setup-swift@7ca6abe6b3b0e8b5421b88be48feee39cbf52c6a # v2
        with:
          swift-version: "6.2"

      - name: Generate Xcode Workspace
        run: make workspace

      - name: Generate Marketing Screenshots
        run: |
          unset TOOLCHAINS
          make ${{ matrix.target }}

      - name: Upload Screenshot Artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-assets-${{ matrix.device }}
          path: ${{ matrix.outdir }}/*/screenshot_*.png
          if-no-files-found: error

      - name: Upload Failure Logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: screenshot-logs-${{ matrix.device }}
          path: |
            /tmp/clipkitty_*_screenshot_test.log
            /tmp/clipkitty_*_screenshot.png
          if-no-files-found: ignore

