name: Build and Release

# Job graph is deliberately wide: every check job starts immediately and runs
# in parallel so failures surface as fast as possible. Artifact publication
# fans in on the checks that establish its inputs. The site depends only on
# its marketing assets; the appcast waits for the site attempt only to serialize
# gh-pages writes, but an unrelated site failure cannot block update delivery.
#
#   version ─────────────┐
#   rust-tests ──────────┤
#   macos-build ─────────┤   (parallel checks / artifact producers)
#   ios-smoke ───────────┤
#   ios-build ───────────┤
#   ios-screenshots ─────┤   (matrix: iphone, ipad)
#   macos-uitests ───────┤
#   macos-marketing ─────┤
#   intro-video-capture ── intro-videos ─┘   (matrix: two balanced locale shards)
#         │
#         ├─ build         (aggregate status check; required by branch protection)
#         ├─ release ─┐    (immutable GitHub beta prerelease)
#         │           ├─ appcast (verified released archive -> Sparkle feed)
#         ├─ gh-pages ┘    (site + screenshot tag)
#         ├─ appstore      (macOS App Store Connect upload)
#         └─ ios-appstore  (iOS App Store Connect upload)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Superseded PR runs are cancelled to free runners for the newest commit.
# In-progress push/dispatch runs are never cancelled. GitHub may coalesce
# whole workflow runs that are still pending, but every publication job that
# becomes eligible enters the explicit FIFO publication queue below.
concurrency:
  group: build-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Authenticate Nix's GitHub fetches (flake inputs like rust-overlay are pulled
# via api.github.com). Without a token these hit unauthenticated rate limits and
# fail intermittently with "HTTP error 401", breaking jobs at "Install CI tools
# from Nix" long before any real work. Set globally so every `nix` call inherits
# it. The Determinate installer's separate FlakeHub login (`flakehub: false`) is
# unaffected; its login warning is non-fatal.
env:
  NIX_CONFIG: |
    access-tokens = github.com=${{ github.token }}

jobs:
  # Cheap and instant: every job that needs version metadata reads it from
  # here instead of resolving it inline on an expensive macOS runner.
  version:
    name: Resolve Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve-version.outputs.version }}
      build_number: ${{ steps.resolve-version.outputs.build_number }}
      channel: ${{ steps.resolve-version.outputs.channel }}
      release_tag: ${{ steps.resolve-version.outputs.release_tag }}
      release_title: ${{ steps.resolve-version.outputs.release_title }}
      release_url: ${{ steps.resolve-version.outputs.release_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0 # Full history for commit count versioning

      - name: Resolve Release Version
        id: resolve-version
        run: |
          BASE_VERSION=$(awk -F '"' '/"MARKETING_VERSION"[[:space:]]*:/ { print $4; exit }' Project.swift)
          if [ -z "$BASE_VERSION" ]; then
            echo "::error::Could not resolve MARKETING_VERSION from Project.swift"
            exit 1
          fi
          MAJOR_MINOR="${BASE_VERSION%.*}"
          COMMIT_COUNT=$(git rev-list --count HEAD)
          VERSION="${MAJOR_MINOR}.${COMMIT_COUNT}"
          echo "Resolved release version: $VERSION"

          # Every build is a beta. The App Store promotion workflow is the sole
          # authority that can publish the corresponding immutable stable tag.
          CHANNEL="beta"
          RELEASE_TAG="v${VERSION}-beta"
          RELEASE_TITLE="ClipKitty v${VERSION} Beta"
          RELEASE_URL="https://github.com/${{ github.repository }}/releases/download/v${VERSION}-beta/ClipKitty.dmg"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build_number=$COMMIT_COUNT" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "release_title=$RELEASE_TITLE" >> "$GITHUB_OUTPUT"
          echo "release_url=$RELEASE_URL" >> "$GITHUB_OUTPUT"
          echo "Final release version: $VERSION"

  # Build the shared Nix graph every Apple job depends on — exactly once,
  # before the parallel jobs fan out — and push it to the shared GitHub
  # Actions Nix cache.
  #
  # The target is `.#clipkitty-generated` (the fully generated Tuist
  # workspace), not just the purr-* Rust overlay: the overlay is a subset,
  # and the marketing / UI-test / screenshot jobs run `make workspace` /
  # `make screenshots`, which build the *whole* generated workspace graph —
  # the purr overlay plus every crate and SwiftPM derivation (askama,
  # tantivy, GRDB, Sparkle, …). Prewarming only the overlay left those
  # jobs rebuilding that ~30 min graph themselves; the marketing job blew
  # its 40 min budget rebuilding it before capturing a single screenshot.
  #
  # Why a dedicated job instead of letting the cache sort itself out: this
  # graph is a ~30 min cold compile that every Apple job pulls in. When all
  # those jobs start at once they each rebuild it AND hammer the GitHub
  # Actions Cache concurrently, which throttles the cache API ("GitHub
  # Actions Cache throttled Magic Nix Cache. Not trying to use it again on
  # this run.") — so nothing is ever restored and the tightly-timed jobs
  # blow their budget. One uncontended prewarm build populates the cache so
  # the fan-out restores instead of recompiling.
  prewarm-nix:
    name: Prewarm Nix Cache
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          lfs: true

      - name: Set up Nix
        uses: ./.github/actions/setup-nix

      - name: Build shared workspace graph
        timeout-minutes: 45
        run: nix build '.#clipkitty-generated' -L

  rust-tests:
    name: Rust Tests
    if: github.event_name != 'workflow_dispatch'
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          lfs: true

      - name: Set up Nix
        uses: ./.github/actions/setup-nix

      - name: Verify lockfile integrity
        run: make check

      - name: Run Rust supply chain scan
        run: nix develop --no-update-lock-file --experimental-features 'nix-command flakes' .#default --command cargo deny check

      - name: Run Rust library tests
        run: nix develop --no-update-lock-file --experimental-features 'nix-command flakes' .#default --command cargo test --manifest-path purr/Cargo.toml --lib --locked

  # macOS release artifacts: App Store archive, hardened archive, and the
  # notarized Sparkle DMG, plus provenance attestation. This is the longest
  # chain and everything in it genuinely is sequential (build → sign →
  # notarize → staple → attest).
  macos-build:
    name: macOS Build
    needs: [version, prewarm-nix]
    runs-on: macos-26
    env:
      VERSION: ${{ github.event_name == 'workflow_dispatch' && '1.13.1469' || needs.version.outputs.version }}
      BUILD_NUMBER: ${{ github.event_name == 'workflow_dispatch' && '1469' || needs.version.outputs.build_number }}
      CLIPKITTY_EMERGENCY_RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && '1.13.1469' || '' }}
      CLIPKITTY_EMERGENCY_RELEASE_BUILD: ${{ github.event_name == 'workflow_dispatch' && '1469' || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          lfs: true
          fetch-depth: 0 # Full history for commit count versioning

      - name: Set up Nix
        uses: ./.github/actions/setup-nix

      - name: Install CI tools from Nix
        run: |
          # Install tools from flake-locked nixpkgs (pinned via flake.lock)
          # The known-good source pins an old Keytap release whose GitHub
          # archive was removed. Use the current publisher's immutable package
          # pin for secret decryption; application source remains bf1505a8.
          nix profile install --no-update-lock-file \
            'github:jul-sh/clipkitty/e6b84d5bc8525107eb97755c9730b4b87c258801#keytap'
          nix profile install --no-update-lock-file .#tuist
          tuist version

      - name: Decrypt secrets
        id: secrets
        run: |
          for f in secrets/*.age; do
            name=$(basename "$f" .age)
            value=$(keytap decrypt clipkitty < "$f")
            echo "::add-mask::$value"
            {
              echo "${name}<<AGEDELIM"
              echo "$value"
              echo "AGEDELIM"
            } >> "$GITHUB_OUTPUT"
          done
        env:
          KEYTAP_KEY_CLIPKITTY: ${{ secrets.AGE_SECRET_KEY }}

      - name: Setup Swift
        uses: swift-actions/setup-swift@7ca6abe6b3b0e8b5421b88be48feee39cbf52c6a # v2
        with:
          swift-version: "6.2"

      # 1. Install Apple Certificates for Signing
      - name: Install Developer ID Certificate
        uses: apple-actions/import-codesign-certs@63fff01cd422d4b7b855d40ca1e9d34d2de9427d # v3
        with:
          p12-file-base64: ${{ steps.secrets.outputs.MACOS_P12_BASE64 }}
          p12-password: ${{ steps.secrets.outputs.MACOS_P12_PASSWORD }}

      - name: Install Apple Development Certificate
        uses: apple-actions/import-codesign-certs@63fff01cd422d4b7b855d40ca1e9d34d2de9427d # v3
        with:
          p12-file-base64: ${{ steps.secrets.outputs.MAC_DEV_P12_BASE64 }}
          p12-password: ${{ steps.secrets.outputs.MAC_DEV_P12_PASSWORD }}
          keychain: dev_signing

      - name: Fix keychain search list
        run: |
          security list-keychains -d user -s \
            ~/Library/Keychains/signing_temp.keychain-db \
            ~/Library/Keychains/dev_signing.keychain-db \
            ~/Library/Keychains/login.keychain-db

      - name: Verify repo invariants
        run: make check

      - name: Build App (AppStore)
        timeout-minutes: 90
        run: make app-app-store
        env:
          KEYTAP_KEY_CLIPKITTY: ${{ secrets.AGE_SECRET_KEY }}

      - name: Stage Hardened App
        timeout-minutes: 30
        run: make app-hardened
        env:
          KEYTAP_KEY_CLIPKITTY: ${{ secrets.AGE_SECRET_KEY }}

      - name: Create AppStore Archive
        run: |
          cd DerivedData/Build/Products/AppStore
          zip -r "$GITHUB_WORKSPACE/ClipKitty-AppStore.zip" ClipKitty.app

      - name: Verify Hardened Entitlements
        run: |
          APP="DerivedData/Build/Products/Hardened/ClipKitty.app"
          echo "=== Hardened entitlements (from signed app) ==="
          codesign -d --entitlements - "$APP" 2>&1
          # Extract entitlements XML and verify contents
          ENT_XML=$(codesign -d --entitlements - "$APP" 2>&1)
          # Verify sandbox is present
          echo "$ENT_XML" | grep -q "app-sandbox"
          # Verify no network entitlement
          if echo "$ENT_XML" | grep -q "network.client"; then
            echo "FAIL: network.client entitlement found in hardened app"
            exit 1
          fi
          # Verify no iCloud entitlements
          if echo "$ENT_XML" | grep -qi "icloud\|cloudkit"; then
            echo "FAIL: iCloud/CloudKit entitlement found in hardened app"
            exit 1
          fi
          echo "Hardened entitlements verified."

      - name: Verify Hardened Binary Linkage
        run: |
          BINARY="DerivedData/Build/Products/Hardened/ClipKitty.app/Contents/MacOS/ClipKitty"
          echo "=== Hardened binary linkage ==="
          otool -L "$BINARY"
          # Verify no Sparkle framework references
          if otool -L "$BINARY" | grep -qi sparkle; then
            echo "FAIL: Sparkle found in hardened binary linkage"
            exit 1
          fi
          echo "No Sparkle linkage in hardened binary."

      - name: Create Hardened Archive
        run: |
          codesign --force --options runtime --sign "Developer ID Application" --entitlements Sources/MacApp/ClipKitty.hardened.entitlements DerivedData/Build/Products/Hardened/ClipKitty.app
          codesign --display --verbose=4 DerivedData/Build/Products/Hardened/ClipKitty.app 2>&1 | grep -q "runtime"
          cd DerivedData/Build/Products/Hardened
          zip -r "$GITHUB_WORKSPACE/ClipKitty-Hardened.zip" ClipKitty.app

      - name: Verify Hardened Feature Surface
        run: |
          APP="DerivedData/Build/Products/Hardened/ClipKitty.app"
          BINARY="$APP/Contents/MacOS/ClipKitty"
          echo "=== Hardened feature surface assertions ==="

          PLIST="$APP/Contents/Info.plist"

          fail() { echo "FAIL: $1"; echo "## Hardened Verification Failed" >> "$GITHUB_STEP_SUMMARY"; echo "$1" >> "$GITHUB_STEP_SUMMARY"; exit 1; }

          # --- Binary-level checks (compiled-out code paths) ---

          # Assert link preview code is compiled out (ENABLE_LINK_PREVIEWS)
          if strings "$BINARY" | grep -q "refreshLinkMetadata"; then
            fail "link preview method 'refreshLinkMetadata' found in hardened binary"
          fi
          echo "✓ No link preview code in binary"

          # Assert iCloud sync code is compiled out (ENABLE_ICLOUD_SYNC)
          if strings "$BINARY" | grep -q "SyncEngine"; then
            fail "SyncEngine found in hardened binary"
          fi
          echo "✓ No iCloud sync code in binary"

          # Assert Sparkle updater code is compiled out (ENABLE_SPARKLE_UPDATES)
          if strings "$BINARY" | grep -q "SPUUpdater"; then
            fail "Sparkle updater class found in hardened binary"
          fi
          echo "✓ No Sparkle update code in binary"

          # Assert file clipboard code is compiled out (ENABLE_FILE_CLIPBOARD_ITEMS)
          if strings "$BINARY" | grep -q "saveFileItems"; then
            fail "file clipboard method 'saveFileItems' found in hardened binary"
          fi
          echo "✓ No file clipboard code in binary"

          # Assert build attestation link code is compiled out (ENABLE_BUILD_ATTESTATION_LINK)
          if strings "$BINARY" | grep -q "checkAttestation"; then
            fail "build attestation link method 'checkAttestation' found in hardened binary"
          fi
          echo "✓ No build attestation link code in binary"

          # --- Build settings checks (Info.plist) ---

          # Verify bundle ID is hardened-specific (separate sandbox container)
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$PLIST" 2>/dev/null || echo "")
          if [ "$BUNDLE_ID" != "com.eviljuliette.clipkitty.hardened" ]; then
            fail "CFBundleIdentifier is '$BUNDLE_ID', expected 'com.eviljuliette.clipkitty.hardened'"
          fi
          echo "✓ Bundle ID: com.eviljuliette.clipkitty.hardened"

          # Verify build channel is Hardened
          CHANNEL=$(/usr/libexec/PlistBuddy -c "Print :CKBuildChannel" "$PLIST" 2>/dev/null || echo "")
          if [ "$CHANNEL" != "Hardened" ]; then
            fail "CKBuildChannel is '$CHANNEL', expected 'Hardened'"
          fi
          echo "✓ Build channel: Hardened"

          # Verify no Sparkle feed URL in Info.plist
          FEED=$(/usr/libexec/PlistBuddy -c "Print :SUFeedURL" "$PLIST" 2>/dev/null || echo "")
          if [ -n "$FEED" ]; then
            fail "SUFeedURL found in hardened Info.plist: $FEED"
          fi
          echo "✓ No Sparkle feed URL in Info.plist"

          # Verify display name is correct
          DISPLAY_NAME=$(/usr/libexec/PlistBuddy -c "Print :CFBundleDisplayName" "$PLIST" 2>/dev/null || echo "")
          if [ "$DISPLAY_NAME" != "ClipKitty Hardened" ]; then
            fail "CFBundleDisplayName is '$DISPLAY_NAME', expected 'ClipKitty Hardened'"
          fi
          echo "✓ Display name: ClipKitty Hardened"

          echo "Hardened feature surface verified."

      # The Sparkle DMG archive builds through the generated workspace
      # (xtask errors with "workspace not found" otherwise).
      - name: Generate Xcode Workspace
        run: make workspace

      - name: Build and Sign DMG
        timeout-minutes: 30
        run: |
          make release-dmg
          codesign --force --sign "Developer ID Application" ClipKitty.dmg
        env:
          KEYTAP_KEY_CLIPKITTY: ${{ secrets.AGE_SECRET_KEY }}

      # 2. Notarize with Apple
      - name: Notarize DMG
        run: |
          echo "$NOTARY_KEY_BASE64" | base64 --decode > auth_key.p8
          xcrun notarytool submit ClipKitty.dmg \
            --key auth_key.p8 \
            --key-id "$NOTARY_KEY_ID" \
            --issuer "$NOTARY_ISSUER_ID" \
            --wait --output-format json | tee notarization_result.json

          STATUS=$(python3 -c "import json,sys; print(json.load(sys.stdin)['status'])" < notarization_result.json)

          if [ "$STATUS" != "Accepted" ]; then
            echo "::error::Notarization failed with status: $STATUS"
            SUBMISSION_ID=$(python3 -c "import json,sys; print(json.load(sys.stdin)['id'])" < notarization_result.json)
            xcrun notarytool log "$SUBMISSION_ID" \
              --key auth_key.p8 \
              --key-id "$NOTARY_KEY_ID" \
              --issuer "$NOTARY_ISSUER_ID" || true
            exit 1
          fi
        env:
          NOTARY_KEY_BASE64: ${{ steps.secrets.outputs.NOTARY_KEY_BASE64 }}
          NOTARY_KEY_ID: ${{ steps.secrets.outputs.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ steps.secrets.outputs.NOTARY_ISSUER_ID }}

      - name: Notarize Hardened ZIP
        run: |
          xcrun notarytool submit ClipKitty-Hardened.zip \
            --key auth_key.p8 \
            --key-id "$NOTARY_KEY_ID" \
            --issuer "$NOTARY_ISSUER_ID" \
            --wait --output-format json | tee notarization_result_hardened.json

          STATUS=$(python3 -c "import json,sys; print(json.load(sys.stdin)['status'])" < notarization_result_hardened.json)

          if [ "$STATUS" != "Accepted" ]; then
            echo "::error::Notarization failed for Hardened ZIP with status: $STATUS"
            SUBMISSION_ID=$(python3 -c "import json,sys; print(json.load(sys.stdin)['id'])" < notarization_result_hardened.json)
            xcrun notarytool log "$SUBMISSION_ID" \
              --key auth_key.p8 \
              --key-id "$NOTARY_KEY_ID" \
              --issuer "$NOTARY_ISSUER_ID" || true
            exit 1
          fi
        env:
          NOTARY_KEY_ID: ${{ steps.secrets.outputs.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ steps.secrets.outputs.NOTARY_ISSUER_ID }}

      - name: Clean up Notary Key
        if: always()
        run: rm -f auth_key.p8

      # 3. Staple Notarization (Required for offline Gatekeeper approval)
      #    Apple's CDN can occasionally lag behind even after "Accepted" status.
      - name: Staple Notarization
        run: |
          for i in $(seq 1 10); do
            if xcrun stapler staple ClipKitty.dmg; then
              echo "Stapling succeeded on attempt $i"
              exit 0
            fi
            echo "Staple attempt $i failed, retrying in 15s..."
            sleep 15
          done
          echo "Stapling failed after 10 attempts"
          exit 1

      - name: Verify lockfiles unchanged before publication
        run: make check

      - name: Upload Artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ClipKitty-Builds
          path: ClipKitty.dmg

      - name: Upload AppStore Build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ClipKitty-AppStore
          path: ClipKitty-AppStore.zip

      - name: Upload Hardened Build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ClipKitty-Hardened
          path: ClipKitty-Hardened.zip

      - name: Upload Release Binary for Attestation
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ClipKitty-Release-Binary
          path: DerivedData/Build/Products/SparkleRelease/ClipKitty.app/Contents/MacOS/ClipKitty
          if-no-files-found: error

  # One-shot emergency publication for the signed build from known-good source
  # bf1505a8. This job exists only on the isolated rollback branch; its dispatch
  # publishes build 1469 to the beta channel and leaves main untouched.
  emergency-sparkle-rollback:
    name: Publish emergency Sparkle rollback
    needs: macos-build
    if: github.event_name == 'workflow_dispatch' && needs.macos-build.result == 'success'
    runs-on: macos-26
    concurrency:
      group: clipkitty-publication
      queue: max
      cancel-in-progress: false
    permissions:
      actions: read
      contents: write

    env:
      ARTIFACT_RUN_ID: ${{ github.run_id }}
      ARTIFACT_SOURCE_SHA: ${{ github.sha }}
      ARTIFACT_BUILD_RESULT: ${{ needs.macos-build.result }}
      KNOWN_GOOD_SHA: bf1505a8edd2f67ea1918dd654fe1c8722c7ec52
      PUBLISHER_SHA: e6b84d5bc8525107eb97755c9730b4b87c258801
      ROLLBACK_VERSION: 1.13.1469
      ROLLBACK_BUILD: "1469"
      ROLLBACK_TAG: v1.13.1469-beta
      ROLLBACK_URL: https://github.com/jul-sh/clipkitty/releases/download/v1.13.1469-beta/ClipKitty.dmg

    steps:
      - name: Checkout pinned publication tooling
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ env.PUBLISHER_SHA }}
          fetch-depth: 0
          path: publisher

      - name: Set up Nix
        uses: ./publisher/.github/actions/setup-nix

      - name: Download signed rollback artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ClipKitty-Builds
          path: rollback-artifact

      - name: Verify known-good source and signed archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          ARCHIVE="$GITHUB_WORKSPACE/rollback-artifact/ClipKitty.dmg"
          test -s "$ARCHIVE"

          RUN_HEAD_SHA="$(
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${ARTIFACT_RUN_ID}" \
              --jq .head_sha
          )"
          test "$RUN_HEAD_SHA" = "$ARTIFACT_SOURCE_SHA"
          test "$ARTIFACT_BUILD_RESULT" = success

          CHANGED_FILES="$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/compare/${KNOWN_GOOD_SHA}...${ARTIFACT_SOURCE_SHA}" \
              --jq '[.files[].filename] | sort | join("\n")'
          )"
          EXPECTED_CHANGES=$'.github/workflows/build.yml\nflake.lock\nflake.nix\ntools/xtask/src/version.rs'
          if [ "$CHANGED_FILES" != "$EXPECTED_CHANGES" ]; then
            echo "::error::Rollback artifact source differs from known-good code:"
            printf '%s\n' "$CHANGED_FILES"
            exit 1
          fi

          MOUNT_POINT="${RUNNER_TEMP}/clipkitty-rollback-mount"
          mkdir -p "$MOUNT_POINT"
          hdiutil attach -readonly -nobrowse -mountpoint "$MOUNT_POINT" "$ARCHIVE"
          cleanup_mount() {
            hdiutil detach "$MOUNT_POINT" -quiet || true
          }
          trap cleanup_mount EXIT

          APP="$MOUNT_POINT/ClipKitty.app"
          PLIST="$APP/Contents/Info.plist"
          test -d "$APP"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$PLIST")" = \
            "com.eviljuliette.clipkitty"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PLIST")" = \
            "$ROLLBACK_VERSION"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$PLIST")" = \
            "$ROLLBACK_BUILD"
          codesign --verify --deep --strict --verbose=2 "$APP"
          spctl --assess --type execute --verbose=4 "$APP"
          xcrun stapler validate "$ARCHIVE"

          cleanup_mount
          trap - EXIT

          ARCHIVE_SHA="$(shasum -a 256 "$ARCHIVE" | awk '{print $1}')"
          echo "ARCHIVE_SHA=$ARCHIVE_SHA" >> "$GITHUB_ENV"
          echo "Verified emergency archive SHA-256: $ARCHIVE_SHA"

      - name: Create immutable emergency prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          ARCHIVE="$GITHUB_WORKSPACE/rollback-artifact/ClipKitty.dmg"
          SERVED_ARCHIVE="${RUNNER_TEMP}/served-rollback/ClipKitty.dmg"
          mkdir -p "$(dirname "$SERVED_ARCHIVE")"

          if gh release view "$ROLLBACK_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            RELEASE_METADATA="$(
              gh release view "$ROLLBACK_TAG" \
                --repo "$GITHUB_REPOSITORY" \
                --json isDraft,isPrerelease \
                --jq '[.isDraft, .isPrerelease] | @tsv'
            )"
            test "$RELEASE_METADATA" = $'false\ttrue'
            TAG_TYPE="$(
              gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${ROLLBACK_TAG}" \
                --jq .object.type
            )"
            TAG_OBJECT="$(
              gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${ROLLBACK_TAG}" \
                --jq .object.sha
            )"
            if [ "$TAG_TYPE" = tag ]; then
              TAG_OBJECT="$(
                gh api "repos/${GITHUB_REPOSITORY}/git/tags/${TAG_OBJECT}" \
                  --jq .object.sha
              )"
            fi
            test "$TAG_OBJECT" = "$ARTIFACT_SOURCE_SHA"
            if gh release download "$ROLLBACK_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --dir "$(dirname "$SERVED_ARCHIVE")" \
              --pattern ClipKitty.dmg; then
              cmp "$ARCHIVE" "$SERVED_ARCHIVE"
            else
              gh release upload "$ROLLBACK_TAG" "$ARCHIVE" \
                --repo "$GITHUB_REPOSITORY"
              gh release download "$ROLLBACK_TAG" \
                --repo "$GITHUB_REPOSITORY" \
                --dir "$(dirname "$SERVED_ARCHIVE")" \
                --pattern ClipKitty.dmg
              cmp "$ARCHIVE" "$SERVED_ARCHIVE"
            fi
          else
            if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${ROLLBACK_TAG}" \
              >/dev/null 2>&1; then
              echo "::error::Tag ${ROLLBACK_TAG} exists without its immutable emergency release."
              exit 1
            fi
            NOTES="${RUNNER_TEMP}/rollback-release-notes.md"
            {
              echo "Emergency Sparkle rollback for the beta channel."
              echo
              echo "This is the known-good application source from \`${KNOWN_GOOD_SHA}\`, rebuilt as"
              echo "Sparkle build \`${ROLLBACK_BUILD}\` so clients on the faulty build 1468 can move"
              echo "forward to it. Application source differs from the known-good commit only by the"
              echo "isolated GitHub Actions workflow, its Keytap tooling pin, and the narrowly"
              echo "validated emergency version override used to sign and notarize this artifact."
              echo
              echo "- Build workflow run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${ARTIFACT_RUN_ID}"
              echo "- Artifact source commit: \`${ARTIFACT_SOURCE_SHA}\`"
              echo "- SHA-256: \`${ARCHIVE_SHA}\`"
            } > "$NOTES"

            gh release create "$ROLLBACK_TAG" "$ARCHIVE" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$ARTIFACT_SOURCE_SHA" \
              --title "ClipKitty ${ROLLBACK_VERSION} Emergency Rollback" \
              --notes-file "$NOTES" \
              --prerelease

            gh release download "$ROLLBACK_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --dir "$(dirname "$SERVED_ARCHIVE")" \
              --pattern ClipKitty.dmg
            cmp "$ARCHIVE" "$SERVED_ARCHIVE"
          fi

      - name: Install Sparkle publication tools
        working-directory: publisher
        run: make install-sparkle-cli

      - name: Publish rollback to the beta appcast
        env:
          GH_TOKEN: ${{ github.token }}
          KEYTAP_KEY_CLIPKITTY: ${{ secrets.AGE_SECRET_KEY }}
        run: |
          set -euo pipefail

          PUBLISHER="$GITHUB_WORKSPACE/publisher"
          ARCHIVE="$GITHUB_WORKSPACE/rollback-artifact/ClipKitty.dmg"
          WORKTREE="${RUNNER_TEMP}/gh-pages-emergency-appcast"

          git -C "$PUBLISHER" config user.name "github-actions[bot]"
          git -C "$PUBLISHER" config user.email "github-actions[bot]@users.noreply.github.com"
          git -C "$PUBLISHER" config --local --unset-all \
            "http.https://github.com/.extraheader" || true
          git config --global --unset-all "http.https://github.com/.extraheader" || true
          git -C "$PUBLISHER" remote set-url origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -C "$PUBLISHER" fetch origin gh-pages
          git -C "$PUBLISHER" worktree add --force -B gh-pages \
            "$WORKTREE" origin/gh-pages
          cleanup_worktree() {
            git -C "$PUBLISHER" worktree remove "$WORKTREE" --force || true
          }
          trap cleanup_worktree EXIT

          cd "$WORKTREE"
          make -C "$PUBLISHER" release-appcast-update \
            STATE_PATH="$(pwd)/appcast-state.json" \
            CHANNEL=beta \
            VERSION="$ROLLBACK_VERSION" \
            BUILD_NUMBER="$ROLLBACK_BUILD" \
            URL="$ROLLBACK_URL"
          make -C "$PUBLISHER" release-appcast-generate \
            STATE_PATH="$(pwd)/appcast-state.json" \
            OUTPUT_PATH="$(pwd)/appcast.xml" \
            CHANNEL=beta \
            ARCHIVE_PATH="$ARCHIVE"
          xmllint --noout appcast.xml

          python3 - <<'PY'
          import json
          import os
          import xml.etree.ElementTree as ET

          sparkle = "http://www.andymatuschak.org/xml-namespaces/sparkle"
          state = json.load(open("appcast-state.json", encoding="utf-8"))
          assert state["beta"] == {
              "version": os.environ["ROLLBACK_VERSION"],
              "build_number": os.environ["ROLLBACK_BUILD"],
              "url": os.environ["ROLLBACK_URL"],
          }
          assert state["stable"] is not None

          root = ET.parse("appcast.xml").getroot()
          matches = []
          for item in root.findall("./channel/item"):
              version = item.findtext(f"{{{sparkle}}}version")
              if version == os.environ["ROLLBACK_BUILD"]:
                  matches.append(item)
          assert len(matches) == 1
          item = matches[0]
          assert item.findtext(f"{{{sparkle}}}shortVersionString") == os.environ["ROLLBACK_VERSION"]
          assert item.findtext(f"{{{sparkle}}}channel") == "beta"
          enclosure = item.find("enclosure")
          assert enclosure is not None
          assert enclosure.attrib["url"] == os.environ["ROLLBACK_URL"]
          assert enclosure.attrib[f"{{{sparkle}}}edSignature"]
          PY

          git add appcast.xml appcast-state.json
          if git diff --cached --quiet; then
            echo "Sparkle appcast already contains emergency build ${ROLLBACK_BUILD}."
          else
            git commit --no-verify -m \
              "Emergency Sparkle rollback ${ROLLBACK_VERSION} [skip ci]"
            git push origin gh-pages
          fi

      - name: Verify served beta rollback
        run: |
          set -euo pipefail

          for attempt in $(seq 1 100); do
            SERVED="${RUNNER_TEMP}/served-appcast.xml"
            if curl -fsSL \
              "https://jul-sh.github.io/clipkitty/appcast.xml?attempt=${attempt}" \
              -o "$SERVED" \
              && grep -q "<sparkle:version>${ROLLBACK_BUILD}</sparkle:version>" "$SERVED" \
              && grep -q "$ROLLBACK_URL" "$SERVED"; then
              xmllint --noout "$SERVED"
              echo "Served appcast contains emergency beta build ${ROLLBACK_BUILD}."
              exit 0
            fi
            sleep 3
          done

          echo "::error::Served appcast did not expose emergency beta build ${ROLLBACK_BUILD}."
          exit 1

  # OIDC and attestation write authority live in this minimal job; none of the
  # PR-controlled build steps can mint attestations or request an OIDC token.
  macos-attestation:
    name: Attest macOS Release Artifacts
    needs: macos-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Download DMG
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ClipKitty-Builds
          path: subjects/dmg

      - name: Download Hardened Build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ClipKitty-Hardened
          path: subjects/hardened

      - name: Download Release Binary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ClipKitty-Release-Binary
          path: subjects/binary

      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            subjects/dmg/ClipKitty.dmg
            subjects/binary/ClipKitty
            subjects/hardened/ClipKitty-Hardened.zip

  # Hermetic nix build proving the iOS target compiles; no signing, no
  # workspace, so it gives the fastest iOS compile feedback we have.
  ios-smoke:
    name: iOS Smoke Build
    needs: prewarm-nix
    if: github.event_name != 'workflow_dispatch'
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          lfs: true

      - name: Set up Nix
        uses: ./.github/actions/setup-nix

      - name: Build iOS Smoke Test
        # 50 min, not 15: unlike the other Nix jobs, this one has no separate
        # `make workspace` step to absorb a cold purr-* build — the Rust
        # cross-compile happens inside this step, on top of the smoke build
        # itself. The shared Nix cache makes the cold case rare, but when the
        # GitHub cache API rate-limits (HTTP 418) the substituter is disabled
        # for the whole job and every purr-* target rebuilds from source
        # (~19 min each, partially parallel — run 28756804534 was still
        # building at the old 30-min cutoff). The timeout has to survive a
        # fully cold, cache-less build.
        timeout-minutes: 50
        run: nix build '.#checks.aarch64-darwin.clipkitty-ios-smoke-build' -L

  # Release-configuration iOS build with App Store provisioning; catches
  # signing/config breakage without waiting for the full publish job.
  ios-build:
    name: iOS Build
    needs: [version, prewarm-nix]
    if: github.event_name != 'workflow_dispatch'
    runs-on: macos-26
    env:
      VERSION: ${{ needs.version.outputs.version }}
      BUILD_NUMBER: ${{ needs.version.outputs.build_number }}

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          lfs: true

      - name: Set up Nix
        uses: ./.github/actions/setup-nix

      - name: Install CI tools from Nix
        run: |
          # age decrypts the ASC auth key below
          nix profile install --no-update-lock-file --inputs-from . keytap#default
          nix profile install --no-update-lock-file .#tuist
          tuist version

      - name: Setup Swift
        uses: swift-actions/setup-swift@7ca6abe6b3b0e8b5421b88be48feee39cbf52c6a # v2
        with:
          swift-version: "6.2"

      - name: Prepare Xcode Authentication
        id: xcode-auth
        run: |
          mkdir -p .make/keys
          make secrets-asc-auth FIELD=private-key-b64 | base64 --decode > .make/keys/AuthKey.p8
          echo "key_id=$(make secrets-asc-auth FIELD=key-id)" >> "$GITHUB_OUTPUT"
          echo "issuer_id=$(make secrets-asc-auth FIELD=issuer-id)" >> "$GITHUB_OUTPUT"
          echo "key_path=$(pwd)/.make/keys/AuthKey.p8" >> "$GITHUB_OUTPUT"
        env:
          KEYTAP_KEY_CLIPKITTY: ${{ secrets.AGE_SECRET_KEY }}

      - name: Generate Xcode Workspace
        run: make workspace

      - name: Build iOS App (AppStore)
        timeout-minutes: 20
        run: |
          xcodebuild build \
            -workspace ClipKitty.xcworkspace \
            -scheme ClipKittyiOS-AppStore \
            -derivedDataPath DerivedData \
            -destination "generic/platform=iOS" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ${{ steps.xcode-auth.outputs.key_path }} \
            -authenticationKeyID ${{ steps.xcode-auth.outputs.key_id }} \
            -authenticationKeyIssuerID ${{ steps.xcode-auth.outputs.issuer_id }} \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGNING_ALLOWED=NO

  # iPhone and iPad marketing screenshots run as independent simulator jobs so
  # a failure on one device surfaces without waiting for the other.
  ios-screenshots:
    name: iOS Screenshots (${{ matrix.device }})
    needs: prewarm-nix
    if: github.event_name == 'push'
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        include:
          - device: iphone
            target: screenshots-ios
            outdir: marketing-ios
          - device: ipad
            target: screenshots-ipad
            outdir: marketing-ipad

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          lfs: true

      - name: Set up Nix
        uses: ./.github/actions/setup-nix

      - name: Install CI tools from Nix
        run: |
          nix profile install --no-update-lock-file .#tuist
          tuist version

      - name: Setup Swift
        uses: swift-actions/setup-swift@7ca6abe6b3b0e8b5421b88be48feee39cbf52c6a # v2
        with:
          swift-version: "6.2"

      - name: Generate Xcode Workspace
        run: make workspace

      - name: Generate Marketing Screenshots
        run: |
          unset TOOLCHAINS
          make ${{ matrix.target }}

      - name: Upload Screenshot Artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-assets-${{ matrix.device }}
          path: ${{ matrix.outdir }}/*/screenshot_*.png
          if-no-files-found: error

      - name: Upload Failure Logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: screenshot-logs-${{ matrix.device }}
          path: /tmp/clipkitty_*_screenshot_test.log
          if-no-files-found: ignore

  macos-uitests:
    name: macOS UI Tests
    needs: prewarm-nix
    if: github.event_name != 'workflow_dispatch'
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          lfs: true

      - name: Configure macOS scrollbar behavior
        run: |
          defaults write -g AppleShowScrollBars -string WhenScrolling
          killall cfprefsd || true

      - name: Set up Nix
        uses: ./.github/actions/setup-nix

      - name: Install CI tools from Nix
        run: |
          nix profile install --no-update-lock-file .#tuist
          tuist version

      - name: Setup Swift
        uses: swift-actions/setup-swift@7ca6abe6b3b0e8b5421b88be48feee39cbf52c6a # v2
        with:
          swift-version: "6.2"

      - name: Generate Xcode Workspace
        run: make workspace

      - name: Run UI Tests
        # 75, not 45: this step's xcodebuild runs the Xcode pre-build action,
        # which compiles the whole Rust workspace (libpurr.a) with cargo
        # before the Swift build even starts — on run 28808214574 that build
        # phase alone took 42 minutes on a slow runner and the suite timed
        # out three minutes after its first test. Cold Rust (~20m) + Swift
        # build (~15m) + full suite (~25m) needs the extra headroom.
        timeout-minutes: 75
        env:
          LOCKED: "1"
        run: |
          set -o pipefail
          set +e
          xcodebuild test \
            -workspace ClipKitty.xcworkspace \
            -scheme ClipKittyUITests \
            -destination "platform=macOS" \
            -destination-timeout 120 \
            -test-timeouts-enabled YES \
            -maximum-test-execution-time-allowance 600 \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            -skip-testing:ClipKittyUITests/ClipKittyUITests/testRecordIntroVideo \
            -skip-testing:ClipKittyUITests/ClipKittyUITests/testTakeMarketingScreenshots \
            -resultBundlePath TestResults.xcresult \
            2>&1 | tee xcodebuild-test.log
          TEST_EXIT=${PIPESTATUS[0]}
          echo "::group::Test Summary"
          grep -E "(Test Case|Test Suite|passed|failed|error:|Failing tests:)" xcodebuild-test.log || true
          echo "::endgroup::"
          if [ -d TestResults.xcresult ]; then
            echo "::group::xcresulttool Summary"
            xcrun xcresulttool get test-results summary --path TestResults.xcresult 2>/dev/null || true
            echo "::endgroup::"
          fi
          exit $TEST_EXIT

      - name: Upload Test Results
        if: always()
        # Diagnostics must not turn an otherwise passing test suite red when
        # the artifact service itself is temporarily unavailable.
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: TestResults
          path: |
            TestResults.xcresult
            xcodebuild-test.log
          if-no-files-found: ignore

  # macOS marketing screenshots and the site icon; consumed by gh-pages and
  # the App Store upload.
  macos-marketing:
    name: macOS Marketing Assets
    needs: prewarm-nix
    if: github.event_name != 'workflow_dispatch'
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          lfs: true

      - name: Configure macOS scrollbar behavior
        run: |
          defaults write -g AppleShowScrollBars -string WhenScrolling
          killall cfprefsd || true

      - name: Set up Nix
        uses: ./.github/actions/setup-nix

      - name: Install CI tools from Nix
        run: |
          # keytap decrypts the screenshot fixtures via $KEYTAP_KEY_CLIPKITTY
          nix profile install --no-update-lock-file --inputs-from . keytap#default
          nix profile install --no-update-lock-file .#tuist
          tuist version

      - name: Setup Swift
        uses: swift-actions/setup-swift@7ca6abe6b3b0e8b5421b88be48feee39cbf52c6a # v2
        with:
          swift-version: "6.2"

      - name: Verify repo invariants
        run: make check

      # Materialize the generated workspace in its own unbounded step, the
      # way ios-build / macos-uitests do. `make screenshots-macos` also
      # generates it internally, but building it here keeps the heavy Nix
      # graph out of the timed screenshot budget: when the shared cache is
      # throttled (all gated jobs restore the same graph at once, which can
      # trip the GitHub Actions Cache rate limit), this step rebuilds it
      # from source without racing a clock. `make screenshots-macos` then
      # finds the store path already present and re-links it instantly.
      - name: Generate Xcode Workspace
        run: make workspace

      - name: Create Virtual Retina Display
        run: |
          xcrun clang -framework CoreGraphics -framework Foundation \
            -o /tmp/create-retina-display distribution/create-retina-display.m
          /tmp/create-retina-display &
          echo "$!" > /tmp/retina-display.pid
          sleep 5

      - name: Generate Marketing Screenshots
        # With the workspace already materialized above, this budget only has
        # to cover the cargo rust-data-gen build (~6 min, a dev-shell binary
        # Nix can't cache) plus the 10-locale screenshot capture.
        timeout-minutes: 40
        run: |
          SKIP_SIGNING=1 LOCKED=1 make screenshots-macos
          ls -lh marketing/*/screenshot_*.png
        env:
          KEYTAP_KEY_CLIPKITTY: ${{ secrets.AGE_SECRET_KEY }}

      - name: Teardown Virtual Display
        if: always()
        run: kill "$(cat /tmp/retina-display.pid 2>/dev/null)" 2>/dev/null || true

      - name: Generate Icon PNG
        run: make site-icon

      - name: Upload Screenshot Artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: assets
          path: |
            build/site/icon.png
            marketing/*/screenshot_*.png
          if-no-files-found: error

  # Generate App Store preview videos in two balanced shards. A single
  # 10-locale job held one hosted runner under Xcode/ffmpeg load for nearly an
  # hour and could lose runner communication near the end. Two shards bound
  # runner lifetime while amortizing the expensive workspace setup; one job
  # per locale would repeat that setup ten times.
  intro-video-capture:
    name: Intro Videos (${{ matrix.shard }})
    needs: prewarm-nix
    runs-on: macos-26
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: a
            locales: en,zh-Hans,ja,fr,pt-BR
          - shard: b
            locales: es,zh-Hant,ko,de,ru

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Set up Nix
        uses: ./.github/actions/setup-nix

      - name: Install CI tools from Nix
        run: |
          nix profile install --no-update-lock-file --inputs-from . keytap#default
          nix profile install --no-update-lock-file --inputs-from . nixpkgs#ffmpeg
          nix profile install --no-update-lock-file .#tuist
          tuist version

      - name: Setup Swift
        uses: swift-actions/setup-swift@7ca6abe6b3b0e8b5421b88be48feee39cbf52c6a # v2
        with:
          swift-version: "6.2"

      - name: Verify repo invariants
        run: make check

      # Materialize the heavy shared workspace outside the bounded capture
      # step. If the Actions cache is throttled, Nix can rebuild here without
      # consuming the per-locale recording budget.
      - name: Generate Xcode Workspace
        run: make workspace

      - name: Create Virtual Retina Display
        run: |
          xcrun clang -framework CoreGraphics -framework Foundation \
            -o /tmp/create-retina-display distribution/create-retina-display.m
          /tmp/create-retina-display &
          echo "$!" > /tmp/retina-display.pid
          sleep 5

      - name: Generate Localized Intro Videos
        timeout-minutes: 40
        run: |
          unset TOOLCHAINS
          SKIP_SIGNING=1 LOCKED=1 make intro-video
        env:
          KEYTAP_KEY_CLIPKITTY: ${{ secrets.AGE_SECRET_KEY }}
          CLIPKITTY_MARKETING_LOCALES: ${{ matrix.locales }}

      - name: Teardown Virtual Display
        if: always()
        run: kill "$(cat /tmp/retina-display.pid 2>/dev/null)" 2>/dev/null || true

      - name: Collect Intro Video Diagnostics
        if: failure()
        run: |
          diagnostics=$(find marketing -type d -name diagnostics -print -quit 2>/dev/null || true)
          if test -z "$diagnostics"; then
            diagnostics="marketing/shard-${{ matrix.shard }}-failure/diagnostics"
            mkdir -p "$diagnostics"
          fi
          if test -d /tmp/clipkitty_video_result.xcresult; then
            ditto /tmp/clipkitty_video_result.xcresult \
              "$diagnostics/clipkitty_video_result.xcresult"
          fi

      - name: Upload Intro Video Diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: intro-video-diagnostics-${{ matrix.shard }}
          path: marketing/*/diagnostics
          if-no-files-found: warn

      - name: Verify lockfiles unchanged after build
        run: make check

      - name: Upload Intro Video Fragment
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: intro-video-${{ matrix.shard }}
          path: marketing
          if-no-files-found: error

  # Reassemble locale fragments into the stable artifact consumed by the
  # aggregate check and App Store publisher. Keeping this job lightweight
  # also gives downstream jobs one explicit completeness boundary.
  intro-videos:
    name: Intro Videos
    needs: intro-video-capture
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Download Intro Video Fragments
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: intro-video-*
          path: marketing
          merge-multiple: true

      - name: Verify Localized Intro Videos
        run: |
          set -euo pipefail
          for locale in en es zh-Hans zh-Hant ja ko fr de pt-BR ru; do
            test -s "marketing/$locale/intro_video.mov"
            test -s "marketing/$locale/intro_video_typing.json"
            jq -e --arg locale "$locale" '
              .locale == $locale and
              ([.scenes[].name] | sort) ==
              (["fast", "find_forever", "multiline", "secure_private"] | sort)
            ' "marketing/$locale/intro_video_typing.json" >/dev/null
          done

      - name: Upload Intro Videos
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: intro-videos
          path: |
            marketing/*/intro_video.mov
            marketing/*/intro_video_typing.json
          if-no-files-found: error

  # Aggregate status check: branch protection requires a check named "build",
  # and PR authors get one canonical pass/fail without enumerating jobs.
  # Screenshot/video jobs are allowed to skip only on PRs, where their job
  # conditions intentionally disable them. Every other result must succeed.
  build:
    needs: [version, prewarm-nix, rust-tests, macos-build, ios-smoke, ios-build, ios-screenshots, macos-uitests, macos-marketing, intro-videos]
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch'

    steps:
      - name: Check job results
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if ! echo "$RESULTS" | jq -e --arg event "$GITHUB_EVENT_NAME" '
            [
              to_entries[]
              | select(
                  .value.result != "success"
                  and (
                    $event != "pull_request"
                    or .value.result != "skipped"
                    or (.key != "ios-screenshots" and .key != "intro-videos")
                  )
                )
            ]
            | length == 0
          ' >/dev/null; then
            echo "::error::One or more required jobs failed or skipped unexpectedly"
            exit 1
          fi

  # Publish the immutable GitHub beta prerelease. Gated on every check job
  # because a release is the one thing we never want to cut from a red commit.
  # Stable publication belongs exclusively to promote-appstore-release.yml.
  release:
    name: Publish Beta Release
    needs: [version, prewarm-nix, rust-tests, macos-build, macos-attestation, ios-smoke, ios-build, ios-screenshots, macos-uitests, macos-marketing, intro-videos]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: clipkitty-publication
      queue: max
      cancel-in-progress: false
    permissions:
      attestations: read
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Download DMG
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ClipKitty-Builds
          path: .

      - name: Download Hardened Build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ClipKitty-Hardened
          path: .

      - name: Publish immutable beta release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.version.outputs.release_tag }}
          RELEASE_TITLE: ${{ needs.version.outputs.release_title }}
        run: |
          set -euo pipefail

          REPO="$GITHUB_REPOSITORY"
          REQUIRED_ASSETS=("ClipKitty.dmg" "ClipKitty-Hardened.zip")
          VERIFY_DIR="$(mktemp -d)"
          NOTES_FILE="$(mktemp)"
          cleanup() {
            rm -rf "$VERIFY_DIR"
            rm -f "$NOTES_FILE"
          }
          trap cleanup EXIT

          for asset in "${REQUIRED_ASSETS[@]}"; do
            if [ ! -s "$asset" ]; then
              echo "::error::Attested release input is missing or empty: ${asset}."
              exit 1
            fi
            gh attestation verify "$asset" \
              --repo "$REPO" \
              --signer-workflow "${REPO}/.github/workflows/build.yml" \
              --source-ref refs/heads/main \
              --source-digest "$GITHUB_SHA" \
              --deny-self-hosted-runners
          done

          resolve_tag_commit() {
            local tag="$1"
            local object_type object_sha depth
            object_type="$(gh api "repos/${REPO}/git/ref/tags/${tag}" --jq .object.type)"
            object_sha="$(gh api "repos/${REPO}/git/ref/tags/${tag}" --jq .object.sha)"
            depth=0
            while [ "$object_type" = "tag" ]; do
              depth=$((depth + 1))
              if [ "$depth" -gt 8 ]; then
                echo "::error::Tag ${tag} has an unexpectedly deep annotated-tag chain." >&2
                return 1
              fi
              object_type="$(gh api "repos/${REPO}/git/tags/${object_sha}" --jq .object.type)"
              object_sha="$(gh api "repos/${REPO}/git/tags/${object_sha}" --jq .object.sha)"
            done
            if [ "$object_type" != "commit" ]; then
              echo "::error::Tag ${tag} resolves to ${object_type}, not a commit." >&2
              return 1
            fi
            printf '%s\n' "$object_sha"
          }

          verify_release_assets() {
            local compare_with_current_build="$1"
            local asset asset_count
            asset_count="$(gh release view "$RELEASE_TAG" --repo "$REPO" --json assets --jq '.assets | length')"
            if [ "$asset_count" -ne "${#REQUIRED_ASSETS[@]}" ]; then
              echo "::error::${RELEASE_TAG} must contain exactly ${#REQUIRED_ASSETS[@]} release assets; found ${asset_count}."
              return 1
            fi
            for asset in "${REQUIRED_ASSETS[@]}"; do
              if ! gh release view "$RELEASE_TAG" --repo "$REPO" --json assets --jq '.assets[].name' | grep -Fxq "$asset"; then
                echo "::error::${RELEASE_TAG} is missing required asset ${asset}."
                return 1
              fi
            done
            gh release download "$RELEASE_TAG" \
              --repo "$REPO" \
              --dir "$VERIFY_DIR" \
              --clobber \
              --pattern "ClipKitty.dmg" \
              --pattern "ClipKitty-Hardened.zip"
            for asset in "${REQUIRED_ASSETS[@]}"; do
              if [ ! -s "$VERIFY_DIR/$asset" ]; then
                echo "::error::Downloaded release asset is missing or empty: ${asset}."
                return 1
              fi
              gh attestation verify "$VERIFY_DIR/$asset" \
                --repo "$REPO" \
                --signer-workflow "${REPO}/.github/workflows/build.yml" \
                --source-ref refs/heads/main \
                --source-digest "$GITHUB_SHA" \
                --deny-self-hosted-runners
              if [ "$compare_with_current_build" = "true" ] \
                && ! cmp -s "$asset" "$VERIFY_DIR/$asset"; then
                echo "::error::Existing ${RELEASE_TAG}/${asset} differs from this run's attested artifact; release tags are immutable."
                return 1
              fi
            done
          }

          cat > "$NOTES_FILE" <<'EOF'
          ## Downloads

          - **`ClipKitty.dmg`** — the standard build. Install this one.
          - **`ClipKitty-Hardened.zip`** — a stripped-down build for particularly security-sensitive environments.

          ## About the hardened build

          The hardened build is a separate ClipKitty binary with features that touch the network or filesystem compiled out — no auto-updates, no iCloud sync, no link previews, no file clipboard items, etc. What remains runs under a macOS App Sandbox that further restricts access to the network and filesystem.

          It ships as a separate app (`com.eviljuliette.clipkitty.hardened`) with its own sandbox container, so it coexists with the standard build without sharing data. Because auto-updates are compiled out, you update it by downloading the next release yourself.

          Every release is built on GitHub's infrastructure and cryptographically attested — see [VERIFY.md](https://github.com/jul-sh/clipkitty/blob/main/VERIFY.md) for how to check that a download matches its source commit.

          ---

          EOF

          COMPARE_WITH_CURRENT_BUILD=true
          if gh release view "$RELEASE_TAG" --repo "$REPO" >/dev/null 2>&1; then
            IS_DRAFT="$(gh release view "$RELEASE_TAG" --repo "$REPO" --json isDraft --jq .isDraft)"
            if ! gh api "repos/${REPO}/git/ref/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
              echo "::error::Existing ${RELEASE_TAG} has no immutable tag ref."
              exit 1
            fi
            TAG_COMMIT="$(resolve_tag_commit "$RELEASE_TAG")"
            if [ "$TAG_COMMIT" != "$GITHUB_SHA" ]; then
              echo "::error::${RELEASE_TAG} points to ${TAG_COMMIT}, expected ${GITHUB_SHA}; refusing to move an immutable release tag."
              exit 1
            fi

            IS_PRERELEASE="$(gh release view "$RELEASE_TAG" --repo "$REPO" --json isPrerelease --jq .isPrerelease)"
            if [ "$IS_DRAFT" = "true" ]; then
              # A prior interrupted draft is safe to repair because it has
              # never been public. Public release assets are never replaced.
              gh release upload "$RELEASE_TAG" \
                --repo "$REPO" \
                --clobber \
                ClipKitty.dmg \
                ClipKitty-Hardened.zip
            elif [ "$IS_PRERELEASE" != "true" ]; then
              echo "::error::Existing public ${RELEASE_TAG} is not a prerelease."
              exit 1
            else
              # A public release's attested immutable assets are authoritative;
              # signed/notarized rebuilds of the same commit are byte-unstable.
              COMPARE_WITH_CURRENT_BUILD=false
            fi
          else
            if gh api "repos/${REPO}/git/ref/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
              TAG_COMMIT="$(resolve_tag_commit "$RELEASE_TAG")"
              if [ "$TAG_COMMIT" != "$GITHUB_SHA" ]; then
                echo "::error::Existing tag ${RELEASE_TAG} points to ${TAG_COMMIT}, expected ${GITHUB_SHA}."
                exit 1
              fi
            else
              gh api --method POST "repos/${REPO}/git/refs" \
                -f ref="refs/tags/${RELEASE_TAG}" \
                -f sha="$GITHUB_SHA" >/dev/null
            fi
            gh release create "$RELEASE_TAG" \
              --repo "$REPO" \
              --verify-tag \
              --title "$RELEASE_TITLE" \
              --notes-file "$NOTES_FILE" \
              --generate-notes \
              --draft \
              --prerelease \
              ClipKitty.dmg \
              ClipKitty-Hardened.zip
          fi

          TAG_COMMIT="$(resolve_tag_commit "$RELEASE_TAG")"
          if [ "$TAG_COMMIT" != "$GITHUB_SHA" ]; then
            echo "::error::${RELEASE_TAG} resolves to ${TAG_COMMIT}, expected ${GITHUB_SHA}."
            exit 1
          fi
          verify_release_assets "$COMPARE_WITH_CURRENT_BUILD"

          IS_DRAFT="$(gh release view "$RELEASE_TAG" --repo "$REPO" --json isDraft --jq .isDraft)"
          CURRENT_TITLE="$(gh release view "$RELEASE_TAG" --repo "$REPO" --json name --jq .name)"
          if [ "$IS_DRAFT" = "true" ] || [ "$CURRENT_TITLE" != "$RELEASE_TITLE" ]; then
            gh release edit "$RELEASE_TAG" \
              --repo "$REPO" \
              --draft=false \
              --prerelease \
              --title "$RELEASE_TITLE"
          fi

          if [ "$(gh release view "$RELEASE_TAG" --repo "$REPO" --json isDraft --jq .isDraft)" != "false" ] \
            || [ "$(gh release view "$RELEASE_TAG" --repo "$REPO" --json isPrerelease --jq .isPrerelease)" != "true" ] \
            || [ "$(gh release view "$RELEASE_TAG" --repo "$REPO" --json name --jq .name)" != "$RELEASE_TITLE" ]; then
            echo "::error::${RELEASE_TAG} was not published with the required prerelease metadata."
            exit 1
          fi

  # Deploy the site whenever its marketing inputs succeeded, even when
  # unrelated checks failed. Sparkle publication is deliberately separate:
  # the appcast must not advertise an archive until the release exists.
  gh-pages:
    name: Deploy to gh-pages
    needs: [macos-marketing, release]
    if: >-
      !cancelled()
      && needs.macos-marketing.result == 'success'
      && github.event_name == 'push'
      && github.ref == 'refs/heads/main'
    runs-on: macos-26
    concurrency:
      group: clipkitty-publication
      queue: max
      cancel-in-progress: false
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Nix
        uses: ./.github/actions/setup-nix

      - name: Install CI tools from Nix
        run: nix profile install --no-update-lock-file --inputs-from . nixpkgs#cmark-gfm

      - name: Download marketing assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: assets
          path: .

      - name: Deploy to gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          WORKTREE="${RUNNER_TEMP}/clipkitty-gh-pages-site-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          WORKTREE_ADDED=false
          cleanup() {
            cd "$GITHUB_WORKSPACE"
            if [ "$WORKTREE_ADDED" = "true" ]; then
              git worktree remove "$WORKTREE" --force || true
            fi
          }
          trap cleanup EXIT

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Authenticate git over HTTPS with the job token explicitly. The
          # runner has no credential helper ("could not read Username ...
          # Device not configured"), so put the token in the remote URL. The
          # checkout step also injects a global http.<host>.extraheader
          # Authorization; combined with a URL credential that yields
          # `remote: Duplicate header: "Authorization"` (HTTP 400), so drop the
          # inherited extraheader and let the URL alone carry the credential.
          git config --local --unset-all "http.https://github.com/.extraheader" || true
          git config --global --unset-all "http.https://github.com/.extraheader" || true
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"

          git fetch origin gh-pages
          git worktree add --force -B gh-pages "$WORKTREE" origin/gh-pages
          WORKTREE_ADDED=true
          cd "$WORKTREE"

          cp "$GITHUB_WORKSPACE/build/site/icon.png" icon.png
          cp "$GITHUB_WORKSPACE/site/public/privacy.html" privacy.html
          cp "$GITHUB_WORKSPACE/site/public/site.css" site.css
          cp "$GITHUB_WORKSPACE/marketing/en/screenshot_1.png" marketing_1.png
          cp "$GITHUB_WORKSPACE/marketing/en/screenshot_2.png" marketing_2.png
          cp "$GITHUB_WORKSPACE/marketing/en/screenshot_3.png" marketing_3.png

          # Generate landing page from README.md (cmark-gfm installed via Nix)
          make -C "$GITHUB_WORKSPACE" site-landing-page > index.html

          git add icon.png privacy.html site.css marketing_1.png marketing_2.png marketing_3.png index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit --no-verify -m "Update site, screenshots and icon [skip ci]"
          fi
          git push origin gh-pages

          SCREENSHOT_TAG="screenshots/${GITHUB_SHA}"
          EXISTING_SCREENSHOT_TAG="$(
            git ls-remote --tags origin "refs/tags/${SCREENSHOT_TAG}" \
              | awk 'NR == 1 { print $1 }'
          )"
          if [ -n "$EXISTING_SCREENSHOT_TAG" ]; then
            echo "Screenshot tag ${SCREENSHOT_TAG} already exists; leaving it immutable."
          else
            git tag "$SCREENSHOT_TAG"
            git push origin "$SCREENSHOT_TAG"
          fi

          REPO="${{ github.repository }}"
          echo "Icon: https://raw.githubusercontent.com/$REPO/gh-pages/icon.png"
          echo "Marketing 1: https://raw.githubusercontent.com/$REPO/gh-pages/marketing_1.png"
          echo "Marketing 2: https://raw.githubusercontent.com/$REPO/gh-pages/marketing_2.png"
          echo "Marketing 3: https://raw.githubusercontent.com/$REPO/gh-pages/marketing_3.png"

  # Publish Sparkle only after the immutable GitHub beta release exists. The
  # gh-pages dependency orders the two writers, but site success is deliberately
  # not required. Verify the served asset byte-for-byte before updating the feed.
  appcast:
    name: Publish Sparkle appcast
    needs: [version, release, gh-pages]
    if: >-
      !cancelled()
      && needs.version.result == 'success'
      && needs.release.result == 'success'
      && github.event_name == 'push'
      && github.ref == 'refs/heads/main'
    runs-on: macos-26
    concurrency:
      group: clipkitty-publication
      queue: max
      cancel-in-progress: false
    permissions:
      attestations: read
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Nix
        uses: ./.github/actions/setup-nix

      - name: Install Sparkle publishing tools
        run: make install-sparkle-cli

      - name: Download and verify released archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          RELEASE_DIR="${RUNNER_TEMP}/appcast-release-archive"
          RELEASE_ARCHIVE="${RELEASE_DIR}/ClipKitty.dmg"

          mkdir -p "$RELEASE_DIR"
          gh release download "${{ needs.version.outputs.release_tag }}" \
            --repo "$GITHUB_REPOSITORY" \
            --dir "$RELEASE_DIR" \
            --clobber \
            --pattern "ClipKitty.dmg"

          if [ ! -s "$RELEASE_ARCHIVE" ]; then
            echo "::error::GitHub release asset is missing or empty: ${RELEASE_ARCHIVE}"
            exit 1
          fi

          gh attestation verify "$RELEASE_ARCHIVE" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/build.yml" \
            --source-ref refs/heads/main \
            --source-digest "$GITHUB_SHA" \
            --deny-self-hosted-runners

          echo "Verified released archive: $(shasum -a 256 "$RELEASE_ARCHIVE" | cut -d' ' -f1)"

      - name: Publish verified Sparkle appcast
        env:
          GH_TOKEN: ${{ github.token }}
          KEYTAP_KEY_CLIPKITTY: ${{ secrets.AGE_SECRET_KEY }}
        run: |
          set -euo pipefail

          RELEASE_ARCHIVE="${RUNNER_TEMP}/appcast-release-archive/ClipKitty.dmg"
          WORKTREE="${RUNNER_TEMP}/gh-pages-appcast"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config --local --unset-all "http.https://github.com/.extraheader" || true
          git config --global --unset-all "http.https://github.com/.extraheader" || true
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"

          git fetch origin gh-pages
          git worktree add --force -B gh-pages "$WORKTREE" origin/gh-pages
          cleanup() {
            cd "$GITHUB_WORKSPACE"
            git worktree remove "$WORKTREE" --force || true
          }
          trap cleanup EXIT

          cd "$WORKTREE"
          make -C "$GITHUB_WORKSPACE" release-appcast-update \
            STATE_PATH="$(pwd)/appcast-state.json" \
            CHANNEL="${{ needs.version.outputs.channel }}" \
            VERSION="${{ needs.version.outputs.version }}" \
            BUILD_NUMBER="${{ needs.version.outputs.build_number }}" \
            URL="${{ needs.version.outputs.release_url }}"

          # Sparkle owns archive signing, bundle metadata extraction,
          # enclosure metadata, and feed serialization. xtask owns only the
          # channel transition and atomically installs the generated feed.
          make -C "$GITHUB_WORKSPACE" release-appcast-generate \
            STATE_PATH="$(pwd)/appcast-state.json" \
            OUTPUT_PATH="$(pwd)/appcast.xml" \
            CHANNEL="${{ needs.version.outputs.channel }}" \
            ARCHIVE_PATH="$RELEASE_ARCHIVE"

          xmllint --noout appcast.xml

          git add appcast.xml appcast-state.json
          if git diff --cached --quiet; then
            echo "Sparkle appcast already matches ${{ needs.version.outputs.version }}."
          else
            git commit --no-verify -m "Update Sparkle appcast ${{ needs.version.outputs.version }} [skip ci]"
            git push origin gh-pages
          fi

  # Upload to App Store Connect via ASC CLI
  appstore:
    runs-on: macos-26
    needs: [rust-tests, macos-build, macos-uitests, macos-marketing, intro-videos]
    if: github.event_name == 'push' && github.ref_name == 'main'

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0 # Full history for commit count versioning

      - name: Set up Nix
        uses: ./.github/actions/setup-nix

      - name: Install CI tools from Nix
        run: |
          nix profile install --no-update-lock-file --inputs-from . keytap#default
          nix profile install --no-update-lock-file .#tuist
          nix profile install --no-update-lock-file .#asc
          tuist version

      - name: Decrypt secrets
        id: secrets
        run: |
          for f in secrets/*.age; do
            name=$(basename "$f" .age)
            value=$(keytap decrypt clipkitty < "$f")
            echo "::add-mask::$value"
            {
              echo "${name}<<AGEDELIM"
              echo "$value"
              echo "AGEDELIM"
            } >> "$GITHUB_OUTPUT"
          done
        env:
          KEYTAP_KEY_CLIPKITTY: ${{ secrets.AGE_SECRET_KEY }}

      - name: Setup Swift
        uses: swift-actions/setup-swift@7ca6abe6b3b0e8b5421b88be48feee39cbf52c6a # v2
        with:
          swift-version: "6.2"

      - name: Install Apple WWDR Intermediate Certificate
        run: |
          curl -sLo "$RUNNER_TEMP/AppleWWDRCAG3.cer" https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer
          echo "dcf21878c77f4198e4b4614f03d696d89c66c66008d4244e1b99161aac91601f  $RUNNER_TEMP/AppleWWDRCAG3.cer" | shasum -a 256 --check
          sudo security add-trusted-cert -d -r unspecified -k /Library/Keychains/System.keychain "$RUNNER_TEMP/AppleWWDRCAG3.cer"

      - name: Install App Store Installer Certificate
        uses: apple-actions/import-codesign-certs@63fff01cd422d4b7b855d40ca1e9d34d2de9427d # v3
        with:
          p12-file-base64: ${{ steps.secrets.outputs.APPSTORE_CERT_BASE64 }}
          p12-password: ${{ steps.secrets.outputs.P12_PASSWORD }}

      - name: Install App Store Application Certificate
        uses: apple-actions/import-codesign-certs@63fff01cd422d4b7b855d40ca1e9d34d2de9427d # v3
        with:
          p12-file-base64: ${{ steps.secrets.outputs.APPSTORE_APP_CERT_BASE64 }}
          p12-password: ${{ steps.secrets.outputs.P12_PASSWORD }}
          keychain: app_signing

      - name: Remove duplicate Application cert from Installer P12
        run: |
          # The Installer P12 bundles an extra Application cert that causes ambiguity.
          # Delete it, keeping only the dedicated one from APPSTORE_APP_CERT_BASE64.
          WANTED=$(security find-certificate -c "3rd Party Mac Developer Application" -Z \
            ~/Library/Keychains/app_signing.keychain-db 2>/dev/null \
            | grep "SHA-1" | awk '{print $NF}')
          for HASH in $(security find-certificate -a -c "3rd Party Mac Developer Application" -Z \
            ~/Library/Keychains/signing_temp.keychain-db 2>/dev/null \
            | grep "SHA-1" | awk '{print $NF}'); do
            if [ "$HASH" != "$WANTED" ]; then
              security delete-certificate -Z "$HASH" ~/Library/Keychains/signing_temp.keychain-db 2>/dev/null || true
            fi
          done
          # Restore signing_temp to search list (the app_signing import above drops it)
          security list-keychains -d user -s \
            ~/Library/Keychains/signing_temp.keychain-db \
            ~/Library/Keychains/app_signing.keychain-db \
            ~/Library/Keychains/login.keychain-db

      - name: Download marketing screenshots
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: assets
          path: .

      - name: Download intro videos
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: intro-videos
          # actions/upload-artifact@v4 strips the common path prefix when every
          # uploaded file lives under it (here `marketing/`), so the artifact
          # contents are `<locale>/intro_video.mov`, not
          # `marketing/<locale>/intro_video.mov`. Restore the expected layout
          # by extracting into `marketing/`.
          path: marketing

      - name: Prepare API Key for Automatic Signing
        run: |
          mkdir -p .make/keys
          make secrets-asc-auth FIELD=private-key-b64 | base64 --decode > .make/keys/AuthKey.p8
        env:
          KEYTAP_KEY_CLIPKITTY: ${{ secrets.AGE_SECRET_KEY }}

      - name: Build and Publish to App Store Connect
        run: |
          unset TOOLCHAINS
          VERSION=$(make release-version FIELD=version)
          COMMIT_COUNT=$(make release-version FIELD=build-number)
          make release-macos-appstore VERSION="$VERSION" BUILD_NUMBER="$COMMIT_COUNT"
        env:
          KEYTAP_KEY_CLIPKITTY: ${{ secrets.AGE_SECRET_KEY }}
          CLIPKITTY_SIGNING_EXTERNAL: "1"
          # The ASC API intermittently takes >30s per request; a metadata
          # PATCH timing out after the binary upload leaves the run
          # unrerunnable (the bundle version is already consumed), so give
          # asc a generous timeout instead. (2026-07-09: run 28994746631.)
          ASC_TIMEOUT: 120s

      - name: Verify lockfiles unchanged
        run: make check

      - name: Upload App Store Attestation Subjects
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ClipKitty-AppStore-Attestation-Subjects
          path: |
            ClipKitty.pkg
            DerivedData/Build/Products/AppStore/ClipKitty.app/Contents/MacOS/ClipKitty
          if-no-files-found: error

      - name: Cleanup
        if: always()
        run: rm -f "$GITHUB_WORKSPACE/ClipKitty.provisionprofile"

  appstore-attestation:
    name: Attest App Store Build
    needs: appstore
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Download App Store Attestation Subjects
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ClipKitty-AppStore-Attestation-Subjects
          path: subjects

      - name: Attest App Store Build Provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            subjects/ClipKitty.pkg
            subjects/DerivedData/Build/Products/AppStore/ClipKitty.app/Contents/MacOS/ClipKitty

  # Upload iOS app to App Store Connect
  ios-appstore:
    runs-on: macos-26
    needs: [rust-tests, ios-build, ios-screenshots]
    if: github.event_name == 'push' && github.ref_name == 'main'

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Set up Nix
        uses: ./.github/actions/setup-nix

      - name: Install CI tools from Nix
        run: |
          nix profile install --no-update-lock-file --inputs-from . keytap#default
          nix profile install --no-update-lock-file .#tuist
          nix profile install --no-update-lock-file .#asc
          tuist version

      - name: Decrypt secrets
        id: secrets
        run: |
          for f in secrets/*.age; do
            name=$(basename "$f" .age)
            value=$(keytap decrypt clipkitty < "$f")
            echo "::add-mask::$value"
            {
              echo "${name}<<AGEDELIM"
              echo "$value"
              echo "AGEDELIM"
            } >> "$GITHUB_OUTPUT"
          done
        env:
          KEYTAP_KEY_CLIPKITTY: ${{ secrets.AGE_SECRET_KEY }}

      - name: Setup Swift
        uses: swift-actions/setup-swift@7ca6abe6b3b0e8b5421b88be48feee39cbf52c6a # v2
        with:
          swift-version: "6.2"

      - name: Install Apple WWDR Intermediate Certificate
        run: |
          curl -sLo "$RUNNER_TEMP/AppleWWDRCAG3.cer" https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer
          echo "dcf21878c77f4198e4b4614f03d696d89c66c66008d4244e1b99161aac91601f  $RUNNER_TEMP/AppleWWDRCAG3.cer" | shasum -a 256 --check
          sudo security add-trusted-cert -d -r unspecified -k /Library/Keychains/System.keychain "$RUNNER_TEMP/AppleWWDRCAG3.cer"

      - name: Install iOS Distribution Certificate
        uses: apple-actions/import-codesign-certs@63fff01cd422d4b7b855d40ca1e9d34d2de9427d # v3
        with:
          p12-file-base64: ${{ steps.secrets.outputs.IOS_DIST_CERT_BASE64 }}
          p12-password: ${{ steps.secrets.outputs.IOS_DIST_P12_PASSWORD }}
          keychain: ios_signing

      - name: Fix keychain search list
        run: |
          security list-keychains -d user -s \
            ~/Library/Keychains/ios_signing.keychain-db \
            ~/Library/Keychains/login.keychain-db

      - name: Install iOS Provisioning Profiles
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$APP_PROFILE" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/clipkitty-ios.mobileprovision
          echo "$SHARE_PROFILE" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/clipkitty-share.mobileprovision
        env:
          APP_PROFILE: ${{ steps.secrets.outputs.IOS_APPSTORE_PROFILE_BASE64 }}
          SHARE_PROFILE: ${{ steps.secrets.outputs.IOS_SHARE_PROFILE_BASE64 }}

      # actions/upload-artifact@v4 strips the common path prefix (here the
      # `marketing-ios/` / `marketing-ipad/` roots), so each artifact holds
      # `<locale>/screenshot_N.png`. Download into explicit directories to
      # restore the expected layout.
      - name: Download iPhone screenshots
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ios-assets-iphone
          path: marketing-ios

      - name: Download iPad screenshots
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ios-assets-ipad
          path: marketing-ipad

      - name: Verify iOS screenshots present
        run: |
          for locale in en es zh-Hans zh-Hant ja ko fr de pt-BR ru; do
            for screenshot in screenshot_1.png screenshot_2.png screenshot_3.png; do
              if [ ! -f "marketing-ios/$locale/$screenshot" ]; then
                echo "::error::Missing marketing-ios/$locale/$screenshot; cannot publish to ASC"
                exit 1
              fi
              if [ ! -f "marketing-ipad/$locale/$screenshot" ]; then
                echo "::error::Missing marketing-ipad/$locale/$screenshot; cannot publish to ASC"
                exit 1
              fi
            done
          done

      - name: Prepare API Key
        run: |
          mkdir -p .make/keys
          make secrets-asc-auth FIELD=private-key-b64 | base64 --decode > .make/keys/AuthKey.p8
        env:
          KEYTAP_KEY_CLIPKITTY: ${{ secrets.AGE_SECRET_KEY }}

      - name: Verify repo invariants
        run: make check

      # Archiving runs appintentsmetadataprocessor, which needs the on-demand
      # Metal toolchain. If its download fails (`error: no tool provided`,
      # status=255 — a transient auth/network hiccup) the archive silently
      # produces an app with an invalid executable that App Store Connect later
      # rejects with 90207. Pre-fetch it here with retries so the archive runs
      # against a present toolchain.
      - name: Pre-download Metal toolchain
        run: |
          unset TOOLCHAINS
          for attempt in 1 2 3; do
            if xcodebuild -downloadComponent MetalToolchain; then
              echo "Metal toolchain ready (attempt $attempt)."
              exit 0
            fi
            echo "Metal toolchain download failed (attempt $attempt); retrying in 30s..."
            sleep 30
          done
          echo "::error::Metal toolchain download failed after 3 attempts."
          exit 1

      - name: Build and Publish iOS to App Store Connect
        run: |
          unset TOOLCHAINS
          VERSION=$(make release-version FIELD=version)
          COMMIT_COUNT=$(make release-version FIELD=build-number)
          make release-ios-appstore VERSION="$VERSION" BUILD_NUMBER="$COMMIT_COUNT"
        env:
          KEYTAP_KEY_CLIPKITTY: ${{ secrets.AGE_SECRET_KEY }}
          # See the macOS publish step: ASC requests can exceed asc's
          # default timeout, and a failed publish can't be rerun once the
          # binary for this build number has been uploaded.
          ASC_TIMEOUT: 120s

      - name: Verify lockfiles unchanged after build
        run: make check

      - name: Cleanup
        if: always()
        run: |
          rm -f ~/Library/MobileDevice/Provisioning\ Profiles/clipkitty-ios.mobileprovision
          rm -f ~/Library/MobileDevice/Provisioning\ Profiles/clipkitty-share.mobileprovision
